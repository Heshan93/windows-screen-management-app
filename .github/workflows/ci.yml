name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OrderBuddy.ScreenManager.sln

      - name: Build
        run: dotnet build OrderBuddy.ScreenManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OrderBuddy.ScreenManager.sln --configuration Release --no-build
